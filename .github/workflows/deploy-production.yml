name: Deploy production

on:
  push:
    branches:
      - codex/production-website-chatbot-platform
  workflow_dispatch:

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.8.0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run tests
        run: pnpm test

      - name: Validate compose files
        run: pnpm check:compose

  deploy:
    needs: verify
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/codex/production-website-chatbot-platform'
    environment: production
    steps:
      - name: Deploy on VPS over SSH
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          command_timeout: 30m
          script: |
            set -euo pipefail
            cd "${{ secrets.VPS_DEPLOY_PATH }}"
            export GIT_SSH_COMMAND="ssh -i ~/.ssh/khanect_deploy_key -o StrictHostKeyChecking=accept-new"
            git fetch origin
            git reset --hard origin/codex/production-website-chatbot-platform
            ./scripts/deploy-vps.sh

      - name: External health check
        env:
          HEALTH_URL: ${{ secrets.DEPLOY_HEALTH_URL }}
        run: |
          if [ -z "$HEALTH_URL" ]; then
            echo "DEPLOY_HEALTH_URL not set; skipping external health check."
            exit 0
          fi
          for _ in $(seq 1 24); do
            if curl -fsS "$HEALTH_URL"; then
              echo "External health check passed."
              exit 0
            fi
            sleep 5
          done
          echo "External health check failed for $HEALTH_URL" >&2
          exit 1