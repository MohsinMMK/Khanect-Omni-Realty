# Optional override: real BGE-M3 dense embeddings (CPU). Stub remains the default in docker-compose.phase0.yml.
#
#   docker compose -f docker-compose.phase0.yml -f docker-compose.bge-m3.yml up -d rag-embedder
#
# First start downloads BAAI/bge-m3 into the huggingface-cache volume.
services:
  rag-embedder:
    build:
      context: .
      dockerfile: apps/rag-embedder/Dockerfile.bge-m3
    image: khanect-omni-realty-rag-embedder:bge-m3
    environment:
      EMBEDDER_MODE: bge-m3
      EMBEDDING_MODEL: BAAI/bge-m3
      HF_HOME: /cache/huggingface
    volumes:
      - huggingface-cache:/cache/huggingface

volumes:
  huggingface-cache: