[project]
name = "khanect-rag-embedder"
version = "0.1.0"
description = "Internal local BGE / stub embedding service for Khanect Omni Realty RAG."
requires-python = ">=3.12,<3.15"
dependencies = [
  "fastapi>=0.138,<1",
  "uvicorn[standard]>=0.49,<1",
  "pydantic>=2.13,<3",
]

[project.optional-dependencies]
bge = [
  "fastembed>=0.7,<1",
]
dev = [
  "pytest>=9,<10",
  "httpx>=0.28,<1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rag_embedder_service"]
