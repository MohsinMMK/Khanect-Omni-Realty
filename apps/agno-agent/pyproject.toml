[project]
name = "khanect-agno-agent"
version = "0.1.0"
description = "Internal Agno agent runtime for Khanect Omni Realty chatbots."
requires-python = ">=3.12,<3.15"
dependencies = [
  "agno==2.6.13",
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.34,<1",
  "pydantic>=2.10,<3",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9",
  "httpx>=0.28,<1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agno_agent_service"]
