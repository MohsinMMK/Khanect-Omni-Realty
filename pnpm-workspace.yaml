packages:
  - "apps/*"
  - "packages/*"

allowBuilds:
  esbuild: true
  msgpackr-extract: true
  msw: false

# Security patches for transitive dependencies; selectors retain their major versions.
overrides:
  "proxy-addr@<2.0.8": "2.0.8"
  "fast-uri@>=3.0.0 <3.1.8": "3.1.8"
  "undici@>=7.0.0 <7.29.1": "7.29.1"
  "find-my-way@>=9.0.0 <9.6.1": "9.9.0"
  "js-yaml@>=4.0.0 <4.3.2": "4.3.2"
  "postcss@>=8.0.0 <8.5.23": "8.5.23"
  "nanoid@>=3.0.0 <3.3.18": "3.3.18"
  "ip-address@>=10.0.0 <10.7.1": "10.7.1"
  "browserslist@>=4.0.0 <4.28.7": "4.28.7"
  "source-map-js@>=1.0.0 <1.2.2": "1.2.2"
  "@modelcontextprotocol/sdk@>=1.12.0 <1.31.0": "1.31.0"
  "brace-expansion@>=5.0.0 <5.0.12": "5.0.12"
