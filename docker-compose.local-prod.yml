name: khanect-omni-realty-local-prod

x-local-prod-environment: &local-prod-environment
  NODE_ENV: production
  APP_VERSION: local-prod
  APP_BASE_URL: http://localhost:8088
  API_BASE_URL: http://localhost:8088/api/v1
  API_INTERNAL_BASE_URL: http://api:3000
  VITE_API_BASE_URL: /api/v1
  CRM_BASE_URL: http://localhost:3001
  CORS_ORIGINS: http://localhost:8088
  DATABASE_URL: postgresql://realestate:change_me@postgres:5432/realestate_app
  REDIS_URL: redis://redis:6379
  BETTER_AUTH_URL: http://localhost:8088
  BETTER_AUTH_SECRET: localprod_better_auth_secret_change_me_64_chars_minimum_value
  ENCRYPTION_KEY: localprod_encryption_key_change_me_64_chars_minimum_value
  ADMIN_API_KEY: localprod_admin_api_key_change_me_64_chars_minimum_value
  PLATFORM_STORE: postgres
  CLAMAV_HOST: clamav
  CLAMAV_PORT: "3310"
  LOG_LEVEL: info
  AGNO_ENABLED: "true"
  AGNO_AGENT_URL: http://agno-agent:8000
  AGNO_SERVICE_TOKEN: localprod_agno_service_token_change_me_64_chars_minimum_value
  AGNO_MODEL: gpt-5-mini
  AGNO_EMBEDDING_MODEL: text-embedding-3-small
  EMBEDDING_PROVIDER: local
  EMBEDDER_URL: http://rag-embedder:8080
  EMBEDDING_MODEL: BAAI/bge-small-en-v1.5
  EMBEDDING_DIMENSION: "384"
  RAG_INDEX_SYNC: "false"
  WORKER_HEALTH_PORT: "3001"

services:
  postgres:
    image: pgvector/pgvector:pg16
    profiles: ["local-prod"]
    environment:
      POSTGRES_DB: realestate_app
      POSTGRES_USER: realestate
      POSTGRES_PASSWORD: change_me
    ports:
      - "55432:5432"
    volumes:
      - local-prod-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U realestate -d realestate_app"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    profiles: ["local-prod"]
    ports:
      - "56379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  clamav:
    image: clamav/clamav:stable
    profiles: ["local-prod"]
    expose:
      - "3310"

  rag-embedder:
    build:
      context: .
      dockerfile: apps/rag-embedder/Dockerfile
    image: khanect-omni-realty-rag-embedder:local-prod
    profiles: ["local-prod"]
    environment:
      EMBEDDER_MODE: local
      EMBEDDING_MODEL: BAAI/bge-small-en-v1.5
      HF_HOME: /cache/huggingface
    ports:
      - "8081:8080"
    volumes:
      - local-prod-huggingface-cache:/cache/huggingface
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health')"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s

  agno-agent:
    build:
      context: .
      dockerfile: apps/agno-agent/Dockerfile
    image: khanect-omni-realty-agno-agent:local-prod
    profiles: ["local-prod"]
    environment:
      AGNO_DATABASE_URL: postgresql://realestate:change_me@postgres:5432/realestate_app
      AGNO_SERVICE_TOKEN: localprod_agno_service_token_change_me_64_chars_minimum_value
      AGNO_MODEL: gpt-5-mini
      AGNO_EMBEDDING_MODEL: text-embedding-3-small
      AGNO_USE_LIVE_AGENT: "1"
      DATABASE_URL: postgresql://realestate:change_me@postgres:5432/realestate_app
    ports:
      - "8001:8000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s

  migrate:
    build:
      context: .
      dockerfile: Dockerfile
    image: khanect-omni-realty-app:local-prod
    profiles: ["local-prod"]
    command: ["pnpm", "--filter", "@workspace/db", "db:migrate"]
    environment: *local-prod-environment
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: khanect-omni-realty-app:local-prod
    profiles: ["local-prod"]
    command: ["node", "apps/api/dist/index.js"]
    environment: *local-prod-environment
    ports:
      - "3002:3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rag-embedder:
        condition: service_healthy
      agno-agent:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      clamav:
        condition: service_started
    volumes:
      - local-prod-uploads-data:/app/uploads
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/v1/health/ready').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    image: khanect-omni-realty-app:local-prod
    profiles: ["local-prod"]
    command: ["node", "apps/worker/dist/index.js"]
    environment: *local-prod-environment
    ports:
      - "3003:3001"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rag-embedder:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      clamav:
        condition: service_started
    volumes:
      - local-prod-uploads-data:/app/uploads
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        VITE_API_BASE_URL: /api/v1
    image: khanect-omni-realty-web:local-prod
    profiles: ["local-prod"]
    ports:
      - "8088:80"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  local-prod-postgres-data:
  local-prod-uploads-data:
  local-prod-huggingface-cache:
