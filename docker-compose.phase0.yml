name: khanect-omni-realty-phase0

x-app-environment: &app-environment
  NODE_ENV: development
  APP_VERSION: phase0
  APP_BASE_URL: http://localhost:3000
  API_BASE_URL: http://localhost:3000/api/v1
  API_INTERNAL_BASE_URL: http://app:3000
  VITE_API_BASE_URL: /api/v1
  CRM_BASE_URL: http://localhost:3001
  DATABASE_URL: postgresql://realestate:change_me@postgres:5432/realestate_app
  REDIS_URL: redis://redis:6379
  BETTER_AUTH_URL: http://localhost:3000
  BETTER_AUTH_SECRET: phase0_dev_only_better_auth_secret_min_32_chars
  ENCRYPTION_KEY: phase0_dev_only_encryption_key_min_32_chars
  CLAMAV_HOST: clamav
  CLAMAV_PORT: "3310"
  LOG_LEVEL: info
  AGNO_ENABLED: "true"
  AGNO_AGENT_URL: http://agno-agent:8000
  AGNO_SERVICE_TOKEN: phase0_dev_only_agno_service_token
  AGNO_MODEL: gpt-5-mini
  AGNO_EMBEDDING_MODEL: text-embedding-3-small
  EMBEDDER_URL: http://rag-embedder:8080
  EMBEDDING_MODEL: BAAI/bge-m3
  RAG_INDEX_SYNC: "false"
  WORKER_HEALTH_PORT: "3001"

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: realestate_app
      POSTGRES_USER: realestate
      POSTGRES_PASSWORD: change_me
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U realestate -d realestate_app"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  clamav:
    image: clamav/clamav:stable

  agno-agent:
    build:
      context: .
      dockerfile: apps/agno-agent/Dockerfile
    image: khanect-omni-realty-agno-agent:phase0
    environment:
      AGNO_SERVICE_TOKEN: phase0_dev_only_agno_service_token
      AGNO_MODEL: gpt-5-mini
      AGNO_EMBEDDING_MODEL: text-embedding-3-small
    expose:
      - "8000"

  rag-embedder:
    build:
      context: .
      dockerfile: apps/rag-embedder/Dockerfile
    image: khanect-omni-realty-rag-embedder:phase0
    environment:
      EMBEDDER_MODE: stub
      EMBEDDING_MODEL: BAAI/bge-m3
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health')"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: khanect-omni-realty-app:phase0
    command: ["node", "apps/api/dist/index.js"]
    environment: *app-environment
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rag-embedder:
        condition: service_healthy
      clamav:
        condition: service_started
      agno-agent:
        condition: service_started
    volumes:
      - uploads-data:/app/uploads
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/v1/health/ready').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    image: khanect-omni-realty-app:phase0
    command: ["node", "apps/worker/dist/index.js"]
    environment: *app-environment
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rag-embedder:
        condition: service_healthy
      clamav:
        condition: service_started
    volumes:
      - uploads-data:/app/uploads
    ports:
      - "3001:3001"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

volumes:
  postgres-data:
  uploads-data:
