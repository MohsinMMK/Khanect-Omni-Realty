# Slim production stack for an 8 GB Hostinger VPS.
# Default: OpenAI embeddings (no local embedder). Only web publishes port 80.
#
#   cp env.production.example .env.production   # edit secrets + domain
#   docker compose -f docker-compose.production.yml --profile production up -d --build
#
name: khanect-omni-realty-production

x-production-environment: &production-environment
  NODE_ENV: production
  APP_VERSION: ${APP_VERSION:-production}
  APP_BASE_URL: ${APP_BASE_URL}
  API_BASE_URL: ${API_BASE_URL}
  API_INTERNAL_BASE_URL: http://api:3000
  VITE_API_BASE_URL: /api/v1
  CRM_BASE_URL: ${CRM_BASE_URL:-}
  CORS_ORIGINS: ${CORS_ORIGINS}
  DATABASE_URL: postgresql://${POSTGRES_USER:-realestate}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-realestate_app}
  REDIS_URL: redis://redis:6379
  BETTER_AUTH_URL: ${BETTER_AUTH_URL}
  BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET}
  ENCRYPTION_KEY: ${ENCRYPTION_KEY}
  ADMIN_API_KEY: ${ADMIN_API_KEY}
  PLATFORM_STORE: postgres
  LOG_LEVEL: ${LOG_LEVEL:-info}
  RAG_INDEX_SYNC: "false"
  WORKER_HEALTH_PORT: "3001"
  # Embeddings: OpenAI text-embedding-3-small @ 1024 (Matryoshka) — no rag-embedder container.
  EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-openai}
  OPENAI_API_KEY: ${OPENAI_API_KEY}
  OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://api.openai.com/v1}
  EMBEDDING_DIMENSION: ${EMBEDDING_DIMENSION:-1024}
  EMBEDDING_MODEL: ${EMBEDDING_MODEL:-text-embedding-3-small}
  EMBEDDER_URL: ${EMBEDDER_URL:-}
  # Answers: configured LLM (Agno disabled on slim VPS).
  AGNO_ENABLED: "false"
  LLM_API_KEY: ${LLM_API_KEY}
  LLM_BASE_URL: ${LLM_BASE_URL:-https://api.openai.com/v1}
  LLM_MODEL: ${LLM_MODEL:-gpt-4o-mini}
  BETTER_AUTH_ENABLED: ${BETTER_AUTH_ENABLED:-true}
  META_WEBHOOK_VERIFY_TOKEN: ${META_WEBHOOK_VERIFY_TOKEN:-}
  WHATSAPP_ENABLED: ${WHATSAPP_ENABLED:-false}
  WHATSAPP_BUSINESS_ACCOUNT_ID: ${WHATSAPP_BUSINESS_ACCOUNT_ID:-}
  WHATSAPP_PHONE_NUMBER_ID: ${WHATSAPP_PHONE_NUMBER_ID:-}
  WHATSAPP_ACCESS_TOKEN: ${WHATSAPP_ACCESS_TOKEN:-}
  INSTAGRAM_MESSAGING_ENABLED: ${INSTAGRAM_MESSAGING_ENABLED:-false}
  INSTAGRAM_BUSINESS_ACCOUNT_ID: ${INSTAGRAM_BUSINESS_ACCOUNT_ID:-}
  INSTAGRAM_PAGE_ID: ${INSTAGRAM_PAGE_ID:-}
  INSTAGRAM_ACCESS_TOKEN: ${INSTAGRAM_ACCESS_TOKEN:-}
  WIDGET_RATE_LIMIT_MAX: ${WIDGET_RATE_LIMIT_MAX:-30}
  WIDGET_RATE_LIMIT_WINDOW_MS: ${WIDGET_RATE_LIMIT_WINDOW_MS:-60000}

x-memory-api: &memory-api
  deploy:
    resources:
      limits:
        memory: 512M

x-memory-worker: &memory-worker
  deploy:
    resources:
      limits:
        memory: 512M

services:
  postgres:
    image: pgvector/pgvector:pg16
    profiles: ["production"]
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-realestate_app}
      POSTGRES_USER: ${POSTGRES_USER:-realestate}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - production-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U realestate -d realestate_app"]
      interval: 10s
      timeout: 5s
      retries: 10
    deploy:
      resources:
        limits:
          memory: 1536M
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    profiles: ["production"]
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    deploy:
      resources:
        limits:
          memory: 128M
    restart: unless-stopped

  migrate:
    build:
      context: .
      dockerfile: Dockerfile
    image: khanect-omni-realty-app:production
    profiles: ["production"]
    command: ["pnpm", "--filter", "@workspace/db", "db:migrate"]
    environment: *production-environment
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: khanect-omni-realty-app:production
    profiles: ["production"]
    command: ["node", "apps/api/dist/index.js"]
    environment: *production-environment
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    volumes:
      - production-uploads-data:/app/uploads
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/v1/health/ready').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s
    <<: *memory-api
    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    image: khanect-omni-realty-app:production
    profiles: ["production"]
    command: ["node", "apps/worker/dist/index.js"]
    environment: *production-environment
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    volumes:
      - production-uploads-data:/app/uploads
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s
    <<: *memory-worker
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        VITE_API_BASE_URL: /api/v1
    image: khanect-omni-realty-web:production
    profiles: ["production"]
    ports:
      - "${WEB_PORT:-80}:80"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 64M
    restart: unless-stopped

volumes:
  production-postgres-data:
  production-uploads-data: